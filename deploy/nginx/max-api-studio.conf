# Reverse proxy for max-api-studio.bitech.id -> pm2 app (open-api-tester-server, port 7091)
# Install: sudo cp this file to /etc/nginx/sites-available/max-api-studio.conf
#          sudo ln -s /etc/nginx/sites-available/max-api-studio.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see README section below) to add HTTPS — certbot will rewrite
# this file to add the `listen 443 ssl` block and the port-80 redirect automatically.
#
# NOTE: if this file was already certbot-ified on the server (has a `listen 443 ssl`
# block), don't just overwrite it with this version — instead copy the two
# `location` blocks below into the existing 443 server block, then `nginx -t && reload`.

# Only send "Connection: upgrade" on actual upgrade requests (websocket), not on
# every request — required so plain SSE/streaming requests aren't mistakenly
# treated as protocol upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name max-api-studio.bitech.id;

    client_max_body_size 20m;

    # MCP endpoint: streams responses over SSE (long-lived, chunked). Buffering
    # or a short read timeout here breaks/delays the stream and disconnects
    # idle MCP clients.
    location /api/mcp {
        proxy_pass http://127.0.0.1:7091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:7091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
