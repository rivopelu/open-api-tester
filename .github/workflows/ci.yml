name: CI

on:
  push:
    branches: ['**']

env:
  PNPM_VERSION: 10.15.0

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @modern-api-studio/client lint

      - name: Build (includes typecheck)
        run: pnpm --filter @modern-api-studio/client build

  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @modern-api-studio/server typecheck

      - name: Lint
        run: pnpm --filter @modern-api-studio/server lint

      - name: Format check
        run: pnpm --filter @modern-api-studio/server format

      - name: Test
        run: pnpm --filter @modern-api-studio/server test
