name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Adjust this if the app should live somewhere else on the VM.
  REMOTE_APP_DIR: /home/ubuntu/apps/open-api-tester
  PNPM_VERSION: 10.15.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Write .env
        env:
          APP_ENV_CONTENT: ${{ secrets.APP_ENV }}
        run: printf '%s\n' "$APP_ENV_CONTENT" > .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @modern-api-studio/client build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust remote host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote app directory exists
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: ssh "$SSH_USERNAME@$SSH_HOST" "mkdir -p '$REMOTE_APP_DIR'"

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='apps/client/src' \
            ./ "$SSH_USERNAME@$SSH_HOST:$REMOTE_APP_DIR/"

      - name: Restart app with pm2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh "$SSH_USERNAME@$SSH_HOST" "
            set -e
            # pm2 is installed globally with bun on the VM (~/.bun/bin); without this it is not on PATH.
            export PATH=\"\$HOME/.bun/bin:\$PATH\"
            command -v pm2 >/dev/null || { echo 'pm2 not found on PATH'; exit 1; }
            cd '$REMOTE_APP_DIR'
            echo \"node \$(node --version), pm2 \$(pm2 --version)\"
            # delete + start (not reload) so changes in ecosystem.config.cjs (interpreter, args) apply.
            pm2 delete open-api-tester-server >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save
          "

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh "$SSH_USERNAME@$SSH_HOST" "
            export PATH=\"\$HOME/.bun/bin:\$PATH\"
            cd '$REMOTE_APP_DIR'
            PORT=\$(grep -E '^PORT=' .env | tail -1 | cut -d= -f2 | tr -d '\"[:space:]')
            PORT=\${PORT:-8888}
            PREFIX=\$(grep -E '^API_PREFIX=' .env | tail -1 | cut -d= -f2 | tr -d '\"[:space:]')
            PREFIX=\${PREFIX:-/api}
            for i in \$(seq 1 20); do
              sleep 3
              if curl -fsS \"http://127.0.0.1:\$PORT\$PREFIX/ping\" >/dev/null; then
                sleep 10
                if curl -fsS \"http://127.0.0.1:\$PORT\$PREFIX/ping\" >/dev/null; then
                  echo \"Healthy on port \$PORT\"
                  pm2 describe open-api-tester-server | grep -E 'status|restarts|uptime|script path|interpreter'
                  exit 0
                fi
              fi
            done
            echo 'App failed health check, recent logs:'
            pm2 describe open-api-tester-server || true
            pm2 logs open-api-tester-server --lines 80 --nostream || true
            exit 1
          "
