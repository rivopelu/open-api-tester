name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Adjust this if the app should live somewhere else on the VM.
  REMOTE_APP_DIR: /home/ubuntu/apps/open-api-tester
  PNPM_VERSION: 10.15.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Write .env
        env:
          APP_ENV_CONTENT: ${{ secrets.APP_ENV }}
        run: printf '%s\n' "$APP_ENV_CONTENT" > .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @modern-api-studio/client build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust remote host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote app directory exists
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: ssh "$SSH_USERNAME@$SSH_HOST" "mkdir -p '$REMOTE_APP_DIR'"

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='apps/client/src' \
            ./ "$SSH_USERNAME@$SSH_HOST:$REMOTE_APP_DIR/"

      - name: Restart app with pm2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh "$SSH_USERNAME@$SSH_HOST" "
            set -e
            export PATH=\"\$HOME/.bun/bin:\$PATH\"
            cd '$REMOTE_APP_DIR'
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
          "
